<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
<h2>University Management System - Login</h2>

<p id="msg"></p>

<form action="/login" method="post">
    Username: <input type="text" name="username"><br><br>
    Password: <input type="password" name="password"><br><br>
    <button type="submit">Login</button>
</form>

<script>
    if (location.search.includes("error")) {
        document.getElementById("msg").innerText = "Wrong username or password!";
    }
    if (location.search.includes("logout")) {
        document.getElementById("msg").innerText = "You have been logged out.";
    }
</script>
</body>
</html>
